server {
  listen 80;
  index index.html;
  server_tokens off;

  location /api/ {
    proxy_set_header Host $http_host;
    client_max_body_size 20M;
    proxy_pass http://backend:8000/api/;
  }
  location /auth/ {
    proxy_set_header Host $http_host;
    client_max_body_size 20M;
    proxy_pass http://backend:8000/auth/;
  }
  location /admin/ {
    proxy_set_header Host $http_host;
    client_max_body_size 20M;
    proxy_pass http://backend:8000/admin/;
  }
  location / {
    proxy_set_header Host $http_host;
    client_max_body_size 20M;
    proxy_pass http://frontend:3000/;
  }
}