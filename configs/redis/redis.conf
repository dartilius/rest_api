# Redis Optimization - In-Memory Only (Cache)
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 4096

# Отключаем systemd supervision и демонизацию
supervised no
daemonize no

# Отключаем PID файл
pidfile ""

# Логирование
loglevel notice
logfile ""

# Настройки базы данных
databases 16
always-show-logo no
set-proc-title yes
proc-title-template "{title} {listen-addr} {server-mode}"

# ВАЖНО: ОТКЛЮЧАЕМ СОХРАНЕНИЕ НА ДИСК!
save ""  # Отключаем все save точки
appendonly no  # Отключаем AOF
rdbcompression no

# Репликация (если не используется)
replica-serve-stale-data yes
replica-read-only yes

# Память - основная настройка!
maxmemory 4GB
maxmemory-policy allkeys-lru  # Вытесняем старые ключи
maxmemory-samples 10

# Отключаем все persistence-related настройки
stop-writes-on-bgsave-error no
rdbchecksum no
dbfilename ""
dir /tmp  # Временная директория

# Оптимизация производительности
activerehashing yes
hz 10
dynamic-hz yes

# Безопасность
requirepass ${REDIS_PASSWORD}

# Клиентские лимиты
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Модули (если нужны)
loadmodule /usr/local/lib/redis/modules/redisbloom.so
loadmodule /usr/local/lib/redis/modules/redisearch.so
loadmodule /usr/local/lib/redis/modules/redistimeseries.so
loadmodule /usr/local/lib/redis/modules/rejson.so
