# postgresql.conf - Оптимизированные настройки для 64GB RAM + SSD
# --------------------------------------------------------------
# Основные настройки подключения
listen_addresses = '*'          # Слушать на всех интерфейсах :cite[3]
port = 5432                     # Порт PostgreSQL

# ===================================================
# ПАМЯТЬ (оптимизировано для 64GB RAM)
# ===================================================
shared_buffers = 16GB                 # 25% от 64GB = 16GB
work_mem = 128MB                       # 64MB на соединение
maintenance_work_mem = 4GB            # Для VACUUM и индексов
effective_cache_size = 48GB           # 75% от 64GB = 48GB
huge_pages = try                      # Использовать huge pages если доступно

# ===================================================
# WAL и CHECKPOINT (КРИТИЧЕСКИ ВАЖНО!)
# ===================================================
max_wal_size = 32GB                   # Большой размер для редких checkpoint'ов
min_wal_size = 8GB                    # Минимальный размер WAL
checkpoint_timeout = 30min            # Реже checkpoint'ы
checkpoint_completion_target = 0.9    # Плавное завершение checkpoint'ов
wal_compression = on                  # Сжатие WAL для экономии места
wal_buffers = 64MB                    # Увеличенный буфер WAL

# Оптимизация для частых UPDATE
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# ===================================================
# НАСТРОЙКИ ДЛЯ SSD (высокая производительность)
# ===================================================
random_page_cost = 1.1                # Низкая стоимость для SSD
effective_io_concurrency = 256        # Высокий параллелизм для SSD
max_worker_processes = 8              # Параллельные запросы
max_parallel_workers_per_gather = 4   # Параллельные операции
max_parallel_workers = 8              # Максимум параллельных воркеров
max_parallel_maintenance_workers = 4  # Параллельное обслуживание

# ===================================================
# ПРОИЗВОДИТЕЛЬНОСТЬ И СОЕДИНЕНИЯ
# ===================================================
max_connections = 200                 # Увеличено количество соединений
bgwriter_delay = 200ms                # Задержка background writer
bgwriter_lru_maxpages = 1000          # Макс. страниц для записи
bgwriter_lru_multiplier = 2.0         # Множитель для background writer

# ===================================================
# МОНИТОРИНГ И ЛОГИРОВАНИЕ
# ===================================================
log_checkpoints = on                  # Логировать checkpoint'ы
log_connections = off                 
log_disconnections = off              
log_duration = off                    
log_line_prefix = '%m [%p] '         
log_timezone = 'UTC'                  
log_min_duration_statement = 1000     # Логировать медленные запросы >1s

# ===================================================
# ПЛАНИРОВЩИК И ОПТИМИЗАЦИЯ
# ===================================================
default_statistics_target = 100       # Более точная статистика
enable_partitionwise_aggregate = on   # Оптимизация для партиций
enable_partitionwise_join = on        # Оптимизация JOIN для партиций
jit = off                             # JIT может быть дорогим

# ===================================================
# НАСТРОЙКИ ПО УМОЛЧАНИЮ
# ===================================================
client_encoding = utf8
timezone = 'UTC'
shared_preload_libraries = 'pg_stat_statements'  # Для мониторинга
