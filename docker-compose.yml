version: '3'

volumes:
  pg_data:
  static:
  media:
  s3:

services:
  db:
    image: postgres:16.2
    container_name: db
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build: ./backend/
    container_name: backend
    env_file: .env
    ports:
      - 8000:8000
    volumes:
      - static:/backend_static
    depends_on:
      - db
      - files

  gateway:
    build:
      context: ./nginx/
      dockerfile: Dockerfile
    container_name: gateway
    volumes:
      - static:/staticfiles/
    ports:
      - 80:80


  files:
    image: minio/minio
    container_name: files
    expose:
      - 9000
      - 9001
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    env_file: .env
    volumes:
      - s3:/data

  frontend:
    env_file: .env
    environment:
      - NEXT_PUBLIC_API_URL=${APP_SERVER_URL}
    container_name: frontend
    image: frontend
    build:
      context: ./frontend
      dockerfile: frontend.dockerfile
    command: cp -r /app/build/. /frontend_static/
    ports:
      - 3000:3000
    depends_on:
      - backend
    volumes:
      - static:/frontend_static