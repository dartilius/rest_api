apiVersion: v1
kind: ConfigMap
metadata: { name: minio-bootstrap-script, namespace: rmc }
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eu
    mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
    for bucket in local-static local-media builds; do mc mb --ignore-existing "local/$bucket"; done
    mc anonymous set download local/local-static
    mc anonymous set download local/builds
    cat >/tmp/nest-read.json <<'EOF'
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket"],"Resource":["arn:aws:s3:::local-media","arn:aws:s3:::local-static","arn:aws:s3:::builds"]},{"Effect":"Allow","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::local-media/*","arn:aws:s3:::local-static/*","arn:aws:s3:::builds/*"]}]}
    EOF
    mc admin policy create local nest-read /tmp/nest-read.json || true
    cat >/tmp/django-write.json <<'EOF'
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket","s3:ListBucketMultipartUploads"],"Resource":["arn:aws:s3:::local-media","arn:aws:s3:::local-static","arn:aws:s3:::builds"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:AbortMultipartUpload","s3:ListMultipartUploadParts"],"Resource":["arn:aws:s3:::local-media/*","arn:aws:s3:::local-static/*","arn:aws:s3:::builds/*"]}]}
    EOF
    mc admin policy create local django-write /tmp/django-write.json || true
    mc admin user add local "$MINIO_STORAGE_ACCESS_KEY" "$MINIO_STORAGE_SECRET_KEY" || true
    mc admin user add local "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY" || true
    mc admin policy attach local nest-read --user "$MINIO_ACCESS_KEY"
    mc admin policy attach local django-write --user "$MINIO_STORAGE_ACCESS_KEY"
---
apiVersion: batch/v1
kind: Job
metadata: { name: minio-bootstrap, namespace: rmc }
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: moechs/bitnami-minio:2026.7.17-debian-12-r5
          imagePullPolicy: IfNotPresent
          command: ['sh', '-ec']
          args: ['export PATH="/opt/bitnami/minio-client/bin:$PATH"; exec sh /scripts/bootstrap.sh']
          envFrom: [{ secretRef: { name: minio-root-credentials } }, { secretRef: { name: django-runtime } }, { secretRef: { name: nest-runtime } }]
          volumeMounts: [{ name: script, mountPath: /scripts, readOnly: true }]
      volumes: [{ name: script, configMap: { name: minio-bootstrap-script, defaultMode: 493 } }]
---
apiVersion: batch/v1
kind: Job
metadata: { name: django-bootstrap, namespace: rmc }
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: django-bootstrap
          image: rmc-django:local
          imagePullPolicy: Never
          command: ['sh', '-ec']
          args:
            - |
              python manage.py shell -c "from django.db import connection; connection.cursor().execute('CREATE EXTENSION IF NOT EXISTS pg_trgm')"
              python manage.py migrate --noinput
              python manage.py migrate --database clickhouse --noinput
              python manage.py collectstatic --noinput
              python manage.py shell -c "from users.models import CustomUser; u, _ = CustomUser.objects.get_or_create(email='$LOCAL_SUPERUSER_EMAIL', defaults={'phone_number': '+79990000001', 'role': 'administrator', 'is_staff': True, 'is_superuser': True}); u.is_staff=True; u.is_superuser=True; u.is_active=True; u.set_password('$LOCAL_SUPERUSER_PASSWORD'); u.save()"
          envFrom: [{ secretRef: { name: django-runtime } }]
          env: [{ name: JWT_PRIVATE_KEY_PATH, value: /run/secrets/jwt/private.pem }, { name: JWT_PUBLIC_KEY_PATH, value: /run/secrets/jwt/public.pem }]
          volumeMounts: [{ name: jwt, mountPath: /run/secrets/jwt, readOnly: true }]
      volumes: [{ name: jwt, secret: { secretName: django-jwt-keys } }]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: nest-reader-grant, namespace: rmc }
data:
  grant.sql: |
    DO $$ BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'nest_source_reader') THEN CREATE ROLE nest_source_reader LOGIN; END IF;
    END $$;
    ALTER ROLE nest_source_reader PASSWORD :'reader_password';
    GRANT CONNECT ON DATABASE rmc TO nest_source_reader;
    GRANT USAGE ON SCHEMA public TO nest_source_reader;
    GRANT SELECT ON ALL TABLES IN SCHEMA public TO nest_source_reader;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO nest_source_reader;
---
apiVersion: batch/v1
kind: Job
metadata: { name: grant-nest-source-reader, namespace: rmc }
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: grant
          image: postgres:18.3
          command: ['sh', '-ec']
          args: ['export PGPASSWORD="$POSTGRES_PASSWORD"; psql -v ON_ERROR_STOP=1 -v reader_password="$SOURCE_DB_PASSWORD" -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f /sql/grant.sql']
          envFrom: [{ secretRef: { name: postgres-credentials } }, { secretRef: { name: nest-runtime } }]
          volumeMounts: [{ name: sql, mountPath: /sql, readOnly: true }]
      volumes: [{ name: sql, configMap: { name: nest-reader-grant } }]
